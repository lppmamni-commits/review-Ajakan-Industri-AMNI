<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Review Hilirisasi Kemendiktisaintek</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Times New Roman', serif; background-color: #f3f4f6; } /* Mengubah font agar lebih mirip dokumen resmi */
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Print Friendly */
        @media print {
            .no-print { display: none; }
            body { background-color: white; }
            .shadow-md, .shadow-xl { box-shadow: none; }
            .border { border: 1px solid #000; }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
        }
        /* Table Styles to match Borang */
        .borang-table th, .borang-table td {
            border: 1px solid #000;
            padding: 4px 8px;
            vertical-align: middle;
        }
        .borang-table th {
            background-color: #e5e7eb;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCe3bnQExpNQIJ6jhAzZKkjrfcAXTbZPcE",
            authDomain: "review-hilirisasi.firebaseapp.com",
            projectId: "review-hilirisasi",
            storageBucket: "review-hilirisasi.firebasestorage.app",
            messagingSenderId: "291942659010",
            appId: "1:291942659010:web:0225a1ab06e140dd9c1c5b",
            measurementId: "G-G7ZG6TJD53"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- DATA KONSTAN ---
        const APP_ID = "hilirisasi-v1"; 
        const COLLECTION_NAME = "reviews";
        const PROPOSALS_COLLECTION = "proposals"; 
        const SETTINGS_COLLECTION = "settings";

        const { useState, useEffect } = React;

        // --- KOMPONEN UTAMA ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('form');
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [dbError, setDbError] = useState(null); 
            const [announcement, setAnnouncement] = useState('');

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                        setLoading(false);
                    } else {
                        auth.signInAnonymously()
                            .catch((error) => {
                                console.error("Auth Error:", error);
                                setLoading(false);
                                if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
                                    setAuthError("Fitur 'Anonymous Auth' belum diaktifkan di Firebase Console.");
                                } else {
                                    setAuthError("Gagal inisialisasi sesi: " + error.message);
                                }
                            });
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const settingsUnsub = db.collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection(SETTINGS_COLLECTION).doc('general')
                    .onSnapshot((doc) => {
                        if (doc.exists) setAnnouncement(doc.data().text || '');
                    }, (error) => {
                        if (error.message.includes("Cloud Firestore API has not been used")) {
                            setDbError({ type: 'missing', msg: "Database Firestore belum dibuat." });
                        } else if (error.code === 'permission-denied') {
                            setDbError({ type: 'rules', msg: "Akses Ditolak: Aturan (Rules) Firestore memblokir akses." });
                        }
                    });
                return () => settingsUnsub();
            }, [user]);

            if (dbError && dbError.type === 'rules') return (
                <div className="min-h-screen flex items-center justify-center bg-orange-50 p-4">
                    <div className="bg-white p-8 rounded border-2 border-orange-500 max-w-2xl text-center font-sans">
                        <h2 className="text-2xl font-bold text-orange-700 mb-2">Akses Database Ditolak</h2>
                        <p className="mb-4">Pastikan Rules Firestore Anda benar:</p>
                        <pre className="text-xs bg-gray-800 text-green-400 p-3 rounded text-left overflow-auto">
{`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /artifacts/{appId}/public/data/{collectionName}/{document=**} {
      allow read, write: if request.auth != null;
    }
    match /{document=**} {
      allow read, write: if false;
    }
  }
}`}
                        </pre>
                    </div>
                </div>
            );

            if (dbError && dbError.type === 'missing') return <div className="p-10 text-center text-red-600 font-bold font-sans">Database Belum Dibuat di Firebase Console.</div>;
            if (authError) return <div className="p-10 text-center text-red-600 font-bold font-sans">{authError}</div>;
            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loading-spinner"></div></div>;

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <nav className="bg-blue-900 text-white shadow-lg no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setView('form')}>
                                    <i data-lucide="file-check" className="w-8 h-8"></i>
                                    <span className="font-bold text-lg hidden sm:block">Sistem Review Hilirisasi</span>
                                </div>
                                <div>
                                    <button onClick={() => setView(view === 'dashboard' ? 'dashboard' : 'login')} className="p-2 rounded-full hover:bg-blue-800 text-white opacity-70 hover:opacity-100 transition-opacity" title="Admin Area">
                                        <i data-lucide="lock" className="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow p-4 sm:p-8">
                        <div className="max-w-7xl mx-auto">
                            {view === 'form' && <ReviewForm user={user} setView={setView} announcement={announcement} />}
                            {view === 'login' && <Login setView={setView} />}
                            {view === 'dashboard' && <AdminDashboard user={user} setView={setView} currentAnnouncement={announcement} />}
                        </div>
                    </main>

                    <footer className="bg-gray-800 text-white py-6 text-center text-sm no-print">
                        <p>&copy; 2025 Universitas Maritim AMNI Semarang</p>
                    </footer>
                </div>
            );
        };

        // --- FORM REVIEW ---
        const ReviewForm = ({ user, setView, announcement }) => {
            const [formData, setFormData] = useState({
                namaReviewer: '', nidnReviewer: '',
                judulPenelitian: '', bidangPenelitian: '', perguruanTinggi: '', programStudi: '',
                ketuaNama: '', ketuaNidn: '', ketuaJabatan: '',
                lamaPenelitian: '', jumlahAnggota: '', luaran: '', tahun: '2025',
                // Scores
                s1_aktivitas: 0, s1_jadwal: 0, s1_tim: 0,
                jenisLuaran: 'ki', s2_ketercapaian: 0, s2_relevansi: 0, s2_periode: 0,
                s3_mitra: 0, s3_koordinasi: 0, s3_pendanaan: 0, s3_pimpinan: 0,
                s4_potensi: 0,
                komentar: ''
            });

            const [proposals, setProposals] = useState([]);
            const [submitting, setSubmitting] = useState(false);
            const [isLocked, setIsLocked] = useState(false);

            // Format tanggal hari ini dalam bahasa Indonesia
            const currentDate = new Date().toLocaleDateString('id-ID', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            useEffect(() => {
                if(!user) return;
                const unsub = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(PROPOSALS_COLLECTION)
                    .onSnapshot(snap => {
                        const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
                        data.sort((a,b) => a.judulPenelitian.localeCompare(b.judulPenelitian));
                        setProposals(data);
                    });
                return () => unsub();
            }, [user]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleScoreChange = (name, val) => {
                setFormData(prev => ({ ...prev, [name]: parseInt(val) }));
            };

            const handleProposalSelect = (e) => {
                const selectedId = e.target.value;
                if (!selectedId) {
                    setIsLocked(false);
                    return;
                }
                const selected = proposals.find(p => p.id === selectedId);
                if (selected) {
                    setFormData(prev => ({
                        ...prev,
                        judulPenelitian: selected.judulPenelitian,
                        bidangPenelitian: selected.bidangPenelitian,
                        perguruanTinggi: selected.perguruanTinggi,
                        programStudi: selected.programStudi,
                        ketuaNama: selected.ketuaNama,
                        ketuaNidn: selected.ketuaNidn,
                        ketuaJabatan: selected.ketuaJabatan || '',
                        lamaPenelitian: selected.lamaPenelitian,
                        jumlahAnggota: selected.jumlahAnggota,
                        luaran: selected.luaran,
                        tahun: selected.tahun
                    }));
                    setIsLocked(true);
                }
            };

            const calculate = () => {
                const t1 = (formData.s1_aktivitas * 20) + (formData.s1_jadwal * 10) + (formData.s1_tim * 10);
                const t2 = (formData.s2_ketercapaian * 10) + (formData.s2_relevansi * 10) + (formData.s2_periode * 10);
                const t3 = (formData.s3_mitra * 8) + (formData.s3_koordinasi * 5) + (formData.s3_pendanaan * 5) + (formData.s3_pimpinan * 7);
                const t4 = (formData.s4_potensi * 5);
                const totalRaw = t1 + t2 + t3 + t4;
                return { totalRaw, finalScale100: totalRaw / 4 };
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user) return alert("Sistem belum siap.");
                if (!formData.namaReviewer || !formData.judulPenelitian) return alert("Mohon lengkapi data.");
                setSubmitting(true);
                const { totalRaw, finalScale100 } = calculate();
                try {
                    const finalData = { ...formData, totalScoreRaw: totalRaw, finalScore100: finalScale100, reviewerId: user.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() };
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_NAME).add(finalData);
                    alert("Berhasil disimpan!");
                    window.location.reload(); 
                } catch (error) { alert("Gagal: " + error.message); } finally { setSubmitting(false); }
            };

            const inputClass = `w-full border border-gray-300 p-2 rounded text-sm ${isLocked ? 'bg-gray-100 text-gray-600 cursor-not-allowed' : ''}`;

            // Helper Component untuk Baris Penilaian
            const ScoreRow = ({ label, items, name, value, rowspan }) => {
                return (
                    <>
                        {items.map((item, idx) => (
                            <tr key={idx}>
                                {idx === 0 && rowspan && <td rowSpan={items.length} className="text-center bg-white">{label}</td>} {/* Render Label only on first item */}
                                {idx === 0 && rowspan && <td rowSpan={items.length} className="text-center font-bold">{item.bobot}</td>}
                                {/* JENIS LUARAN CELL: Only for specific row */}
                                {item.jenisLuaranContent ? item.jenisLuaranContent : (idx === 0 && rowspan && <td rowSpan={items.length} className="bg-gray-50"></td>)}
                                
                                <td className="text-sm">{item.text}</td>
                                <td className="text-center font-bold">{item.score}</td>
                                {idx === 0 && rowspan && (
                                    <td rowSpan={items.length} className="text-center">
                                        <div className="flex flex-col items-center justify-center space-y-2">
                                            {items.map((opt) => (
                                                <label key={opt.score} className="inline-flex items-center cursor-pointer" title={`Pilih Skor ${opt.score}`}>
                                                    <input 
                                                        type="radio" 
                                                        name={name} 
                                                        value={opt.score} 
                                                        checked={value === opt.score} 
                                                        onChange={(e) => handleScoreChange(name, e.target.value)}
                                                        className="form-radio h-4 w-4 text-blue-600"
                                                    />
                                                    <span className="ml-1 text-xs text-gray-500">({opt.score})</span>
                                                </label>
                                            ))}
                                            <div className="mt-1 font-bold text-lg text-blue-800 border-t w-full">{value}</div>
                                        </div>
                                    </td>
                                )}
                                {idx === 0 && rowspan && (
                                    <td rowSpan={items.length} className="text-center font-bold text-lg">
                                        {value * item.bobot}
                                    </td>
                                )}
                            </tr>
                        ))}
                    </>
                );
            };

            return (
                <div className="max-w-6xl mx-auto bg-white shadow-xl min-h-screen">
                    {announcement && <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 shadow-sm"><div className="flex"><i data-lucide="info" className="h-5 w-5 text-yellow-400 flex-shrink-0"></i><p className="ml-3 text-sm text-yellow-700 whitespace-pre-wrap">{announcement}</p></div></div>}
                    
                    <div className="p-8 md:p-12">
                        {/* HEADER IDENTITAS AMNI */}
                        <div className="text-center mb-8 border-b-2 border-black pb-4">
                            <div className="flex flex-col items-center justify-center mb-4">
                                <img src="https://pmb.unimar-amni.ac.id/assets/front1/img/amni-png.png" alt="Logo UNIMAR AMNI" className="h-24 mb-2 object-contain"/>
                                <h2 className="text-xl font-bold text-blue-900 uppercase tracking-wide font-sans">Lembaga Penelitian dan Pengabdian Kepada Masyarakat</h2>
                                <h1 className="text-3xl font-extrabold text-blue-900 uppercase tracking-wide font-sans">Universitas Maritim AMNI Semarang</h1>
                            </div>
                            <h2 className="text-xl font-bold uppercase mt-4 underline decoration-2 underline-offset-4">FORMULIR PENILAIAN MONITORING DAN EVALUASI INTERNAL DAN EKSTERNAL</h2>
                            <h3 className="text-lg font-bold uppercase mt-1">AJAKAN INDUSTRI TAHUN 2025</h3>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-6">
                            {/* PILIH USULAN */}
                            <div className="bg-blue-50 p-4 rounded border border-blue-200 font-sans">
                                <label className="block text-sm font-bold text-blue-800 mb-2">Pilih Usulan / Judul Penelitian (Autofill)</label>
                                <select onChange={handleProposalSelect} className="w-full border border-blue-300 p-2 rounded text-gray-700">
                                    <option value="">-- Pilih Judul dari Database (Opsional) --</option>
                                    {proposals.map(p => (
                                        <option key={p.id} value={p.id}>{p.judulPenelitian} - {p.ketuaNama}</option>
                                    ))}
                                </select>
                            </div>

                            {/* IDENTITAS */}
                            <div className="grid grid-cols-1 gap-6 font-sans text-sm">
                                {/* Reviewer */}
                                <div className="border border-black p-4">
                                    <h4 className="font-bold text-lg mb-3 border-b border-gray-400 pb-1">Identitas Reviewer</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><label className="block font-semibold">Nama Reviewer :</label><input type="text" name="namaReviewer" value={formData.namaReviewer} onChange={handleChange} className="w-full border-b border-gray-400 p-1 focus:outline-none focus:border-blue-500" required /></div>
                                        <div><label className="block font-semibold">NIDN Reviewer :</label><input type="text" name="nidnReviewer" value={formData.nidnReviewer} onChange={handleChange} className="w-full border-b border-gray-400 p-1 focus:outline-none focus:border-blue-500" required /></div>
                                    </div>
                                </div>

                                {/* Peneliti */}
                                <div className="border border-black p-4 relative">
                                    <h4 className="font-bold text-lg mb-3 border-b border-gray-400 pb-1 flex justify-between">
                                        Identitas Peneliti {isLocked && <span className="text-xs text-red-500 font-normal bg-red-50 px-2 py-0.5 rounded border border-red-200">Locked</span>}
                                    </h4>
                                    <div className="space-y-2">
                                        <div className="grid grid-cols-[150px_1fr] items-center"><label className="font-semibold">Judul Penelitian :</label><textarea name="judulPenelitian" value={formData.judulPenelitian} onChange={handleChange} className={`${inputClass} h-16`} required readOnly={isLocked}></textarea></div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="grid grid-cols-[150px_1fr] items-center"><label className="font-semibold">Bidang Penelitian :</label><input type="text" name="bidangPenelitian" value={formData.bidangPenelitian} onChange={handleChange} className={inputClass} readOnly={isLocked} /></div>
                                            <div className="grid grid-cols-[150px_1fr] items-center"><label className="font-semibold">Tahun :</label><input type="text" name="tahun" value={formData.tahun} onChange={handleChange} className={inputClass} readOnly={isLocked} /></div>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="grid grid-cols-[150px_1fr] items-center"><label className="font-semibold">Perguruan Tinggi :</label><input type="text" name="perguruanTinggi" value={formData.perguruanTinggi} onChange={handleChange} className={inputClass} readOnly={isLocked} /></div>
                                            <div className="grid grid-cols-[150px_1fr] items-center"><label className="font-semibold">Program Studi :</label><input type="text" name="programStudi" value={formData.programStudi} onChange={handleChange} className={inputClass} readOnly={isLocked} /></div>
                                        </div>
                                        
                                        <div className="mt-2 pl-4 border-l-4 border-gray-200">
                                            <div className="font-bold mb-1 text-gray-700">Ketua Peneliti</div>
                                            <div className="grid grid-cols-[130px_1fr] items-center mb-1"><label className="text-gray-600">Nama Lengkap :</label><input type="text" name="ketuaNama" value={formData.ketuaNama} onChange={handleChange} className={inputClass} required readOnly={isLocked} /></div>
                                            <div className="grid grid-cols-[130px_1fr] items-center mb-1"><label className="text-gray-600">NIDN/NIDK :</label><input type="text" name="ketuaNidn" value={formData.ketuaNidn} onChange={handleChange} className={inputClass} required readOnly={isLocked} /></div>
                                            <div className="grid grid-cols-[130px_1fr] items-center"><label className="text-gray-600">Jabatan Fungsional :</label><input type="text" name="ketuaJabatan" value={formData.ketuaJabatan} onChange={handleChange} className={inputClass} readOnly={isLocked} /></div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                                            <div className="grid grid-cols-[150px_1fr] items-center"><label className="font-semibold">Lama Penelitian :</label><input type="text" name="lamaPenelitian" value={formData.lamaPenelitian} onChange={handleChange} className={inputClass} readOnly={isLocked} /></div>
                                            <div className="grid grid-cols-[150px_1fr] items-center"><label className="font-semibold">Jumlah Anggota :</label><input type="number" name="jumlahAnggota" value={formData.jumlahAnggota} onChange={handleChange} className={inputClass} readOnly={isLocked} /></div>
                                        </div>
                                        <div className="grid grid-cols-[150px_1fr] items-center"><label className="font-semibold">Luaran :</label><input type="text" name="luaran" value={formData.luaran} onChange={handleChange} className={inputClass} readOnly={isLocked} /></div>
                                    </div>
                                </div>
                            </div>

                            {/* MATRIKS PENILAIAN */}
                            <div className="overflow-x-auto">
                                <table className="w-full borang-table border-collapse text-sm">
                                    <thead>
                                        <tr>
                                            <th rowSpan="2" className="w-8 bg-gray-200">NO</th>
                                            <th rowSpan="2" className="bg-gray-200 w-1/6">KOMPONEN PENILAIAN</th>
                                            <th colSpan="7" className="bg-gray-200">PENILAIAN</th>
                                        </tr>
                                        <tr>
                                            <th className="bg-gray-100">INDIKATOR PENILAIAN</th>
                                            <th className="bg-gray-100 w-12">Bobot (%)</th>
                                            <th className="bg-gray-100 w-24">JENIS LUARAN</th>
                                            <th className="bg-gray-100">ITEM</th>
                                            <th className="bg-gray-100 w-10">SKOR</th>
                                            <th className="bg-gray-100 w-24">SKOR PENILAIAN (Pilih Salah Satu)</th>
                                            <th className="bg-gray-100 w-24">NILAI (SKOR X BOBOT)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {/* 1. PELAKSANAAN PENELITIAN (40%) */}
                                        <tr>
                                            <td rowSpan="9" className="text-center font-bold">1</td>
                                            <td rowSpan="9" className="font-bold bg-white">Pelaksanaan Penelitian (40%)</td>
                                            {/* Sub 1: Aktivitas */}
                                            <td rowSpan="3" className="text-center">Kesesuaian Aktivitas</td>
                                            <td rowSpan="3" className="text-center font-bold">20</td>
                                            <td rowSpan="3" className="bg-gray-50"></td>
                                            <td>Pelaksanaan Penelitian Tidak Sesuai Dengan Aktivitas yang Sudah Direncanakan</td>
                                            <td className="text-center font-bold">1</td>
                                            <td rowSpan="3" className="text-center align-middle">
                                                <div className="flex flex-col space-y-2 items-center">
                                                    {[1, 3, 4].map(s => <input key={s} type="radio" name="s1_aktivitas" value={s} checked={formData.s1_aktivitas === s} onChange={e => handleScoreChange('s1_aktivitas', e.target.value)} className="h-4 w-4" />)}
                                                    <span className="font-bold text-blue-800 text-lg border-t w-full pt-1">{formData.s1_aktivitas}</span>
                                                </div>
                                            </td>
                                            <td rowSpan="3" className="text-center font-bold text-lg">{formData.s1_aktivitas * 20}</td>
                                        </tr>
                                        <tr><td>Pelaksanaan Penelitian 50% Sesuai Dengan Aktivitas yang Sudah Direncanakan</td><td className="text-center font-bold">3</td></tr>
                                        <tr><td>Pelaksanaan Penelitian &gt;= 80% Sesuai Dengan Aktivitas yang Sudah Direncanakan</td><td className="text-center font-bold">4</td></tr>
                                        
                                        {/* Sub 2: Jadwal */}
                                        <tr>
                                            <td rowSpan="3" className="text-center">Kesesuaian Jadwal</td>

                    {/* Navigasi Tab */}
                    <div className="flex border-b border-gray-300">
                        <button onClick={() => setTab('reviews')} className={`px-4 py-2 font-medium ${tab === 'reviews' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>Hasil Review ({reviews.length})</button>
                        <button onClick={() => setTab('proposals')} className={`px-4 py-2 font-medium ${tab === 'proposals' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>Manajemen Data Peneliti ({proposals.length})</button>
                    </div>

                    {/* TAB 1: HASIL REVIEW */}
                    {tab === 'reviews' && (
                        <div className="bg-white p-6 rounded shadow">
                            <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold">Rekapitulasi Nilai</h2><div className="flex gap-2"><button onClick={exportToExcel} className="bg-green-600 text-white px-3 py-1 rounded">Excel</button><button onClick={() => setView('form')} className="bg-red-500 text-white px-3 py-1 rounded">Keluar</button></div></div>
                            <div className="overflow-x-auto"><table className="min-w-full divide-y divide-gray-200 border text-sm"><thead className="bg-gray-50"><tr><th className="p-2 text-left">Judul</th><th className="p-2 text-left">Ketua</th><th className="p-2 text-left">Reviewer</th><th className="p-2 text-center">Nilai</th><th className="p-2">Komentar</th></tr></thead><tbody>{reviews.map(r => (<tr key={r.id} className="border-b"><td className="p-2 font-medium">{r.judulPenelitian}</td><td className="p-2">{r.ketuaNama}</td><td className="p-2">{r.namaReviewer}</td><td className="p-2 text-center font-bold text-blue-600">{r.finalScore100}</td><td className="p-2 italic text-gray-500 truncate max-w-xs">{r.komentar}</td></tr>))}</tbody></table></div>
                        </div>
                    )}

                    {/* TAB 2: MANAJEMEN PROPOSAL */}
                    {tab === 'proposals' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Form Input */}
                            <div className="bg-white p-6 rounded shadow lg:col-span-1 border-t-4 border-blue-500">
                                <h3 className="font-bold text-lg mb-4">{isEditing ? 'Edit Data Peneliti' : 'Tambah Data Peneliti Baru'}</h3>
                                <form onSubmit={handleProposalSubmit} className="space-y-3 text-sm">
                                    <div><label>Judul Penelitian</label><textarea className="w-full border p-2 rounded" rows="2" required value={proposalForm.judulPenelitian} onChange={e => setProposalForm({...proposalForm, judulPenelitian: e.target.value})}></textarea></div>
                                    <div><label>Nama Ketua</label><input className="w-full border p-2 rounded" required value={proposalForm.ketuaNama} onChange={e => setProposalForm({...proposalForm, ketuaNama: e.target.value})} /></div>
                                    <div><label>NIDN Ketua</label><input className="w-full border p-2 rounded" required value={proposalForm.ketuaNidn} onChange={e => setProposalForm({...proposalForm, ketuaNidn: e.target.value})} /></div>
                                    <div><label>Jabatan Fungsional</label><input className="w-full border p-2 rounded" value={proposalForm.ketuaJabatan} onChange={e => setProposalForm({...proposalForm, ketuaJabatan: e.target.value})} /></div>
                                    <div><label>Perguruan Tinggi</label><input className="w-full border p-2 rounded" required value={proposalForm.perguruanTinggi} onChange={e => setProposalForm({...proposalForm, perguruanTinggi: e.target.value})} /></div>
                                    <div><label>Program Studi</label><input className="w-full border p-2 rounded" value={proposalForm.programStudi} onChange={e => setProposalForm({...proposalForm, programStudi: e.target.value})} /></div>
                                    <div><label>Bidang Penelitian</label><input className="w-full border p-2 rounded" value={proposalForm.bidangPenelitian} onChange={e => setProposalForm({...proposalForm, bidangPenelitian: e.target.value})} /></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label>Lama (Thn)</label><input className="w-full border p-2 rounded" value={proposalForm.lamaPenelitian} onChange={e => setProposalForm({...proposalForm, lamaPenelitian: e.target.value})} /></div>
                                        <div><label>Jml Anggota</label><input className="w-full border p-2 rounded" value={proposalForm.jumlahAnggota} onChange={e => setProposalForm({...proposalForm, jumlahAnggota: e.target.value})} /></div>
                                    </div>
                                    <div><label>Luaran</label><input className="w-full border p-2 rounded" value={proposalForm.luaran} onChange={e => setProposalForm({...proposalForm, luaran: e.target.value})} /></div>
                                    
                                    <div className="flex gap-2 pt-2">
                                        <button className="flex-grow bg-blue-600 text-white py-2 rounded hover:bg-blue-700">{isEditing ? 'Update Data' : 'Simpan Data'}</button>
                                        {isEditing && <button type="button" onClick={() => { setIsEditing(false); setProposalForm({ judulPenelitian: '', bidangPenelitian: '', perguruanTinggi: '', programStudi: '', ketuaNama: '', ketuaNidn: '', ketuaJabatan: '', lamaPenelitian: '', jumlahAnggota: '', luaran: '', tahun: '2025' }); }} className="bg-gray-300 text-gray-700 px-3 rounded">Batal</button>}
                                    </div>
                                </form>
                            </div>

                            {/* Tabel List */}
                            <div className="bg-white p-6 rounded shadow lg:col-span-2 overflow-hidden">
                                <h3 className="font-bold text-lg mb-4">Daftar Data Peneliti Terdaftar ({proposals.length})</h3>
                                <div className="overflow-x-auto">
                                    <table className="min-w-full divide-y divide-gray-200 border text-xs">
                                        <thead className="bg-gray-50"><tr><th className="p-2 text-left">Judul</th><th className="p-2 text-left">Ketua / PT</th><th className="p-2 text-center">Aksi</th></tr></thead>
                                        <tbody className="divide-y divide-gray-200">
                                            {proposals.length === 0 ? <tr><td colSpan="3" className="p-4 text-center text-gray-500">Belum ada data. Silakan input di form sebelah kiri.</td></tr> : 
                                            proposals.map(p => (
                                                <tr key={p.id} className="hover:bg-blue-50">
                                                    <td className="p-2 font-medium text-gray-900">{p.judulPenelitian}</td>
                                                    <td className="p-2 text-gray-600">{p.ketuaNama}<br/><span className="text-xs text-gray-400">{p.perguruanTinggi}</span></td>
                                                    <td className="p-2 text-center">
                                                        <button onClick={() => handleEditProposal(p)} className="text-blue-600 hover:text-blue-900 mr-2" title="Edit"><i data-lucide="edit" className="w-4 h-4 inline"></i></button>
                                                        <button onClick={() => handleDeleteProposal(p.id)} className="text-red-600 hover:text-red-900" title="Hapus"><i data-lucide="trash-2" className="w-4 h-4 inline"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && window.lucide.createIcons(), 1000);
    </script>
</body>
</html>
