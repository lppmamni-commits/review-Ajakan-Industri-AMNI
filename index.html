<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Review Hilirisasi Kemendiktisaintek</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Print Friendly */
        @media print {
            .no-print { display: none; }
            body { background-color: white; }
            .shadow-md, .shadow-xl { box-shadow: none; }
            .border { border: 1px solid #000; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCe3bnQExpNQIJ6jhAzZKkjrfcAXTbZPcE",
            authDomain: "review-hilirisasi.firebaseapp.com",
            projectId: "review-hilirisasi",
            storageBucket: "review-hilirisasi.firebasestorage.app",
            messagingSenderId: "291942659010",
            appId: "1:291942659010:web:0225a1ab06e140dd9c1c5b",
            measurementId: "G-G7ZG6TJD53"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- DATA KONSTAN ---
        const APP_ID = "hilirisasi-v1"; 
        const COLLECTION_NAME = "reviews";
        const PROPOSALS_COLLECTION = "proposals"; // Koleksi baru untuk Master Data
        const SETTINGS_COLLECTION = "settings";

        const { useState, useEffect } = React;

        // --- KOMPONEN UTAMA ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('form');
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [dbError, setDbError] = useState(null); 
            const [announcement, setAnnouncement] = useState('');

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                        setLoading(false);
                    } else {
                        auth.signInAnonymously()
                            .catch((error) => {
                                console.error("Auth Error:", error);
                                setLoading(false);
                                if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
                                    setAuthError("Fitur 'Anonymous Auth' belum diaktifkan di Firebase Console.");
                                } else {
                                    setAuthError("Gagal inisialisasi sesi: " + error.message);
                                }
                            });
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const settingsUnsub = db.collection('artifacts').doc(APP_ID)
                    .collection('public').doc('data')
                    .collection(SETTINGS_COLLECTION).doc('general')
                    .onSnapshot((doc) => {
                        if (doc.exists) setAnnouncement(doc.data().text || '');
                    }, (error) => {
                        if (error.message.includes("Cloud Firestore API has not been used")) {
                            setDbError({ type: 'missing', msg: "Database Firestore belum dibuat." });
                        } else if (error.code === 'permission-denied') {
                            setDbError({ type: 'rules', msg: "Akses Ditolak: Aturan (Rules) Firestore memblokir akses." });
                        }
                    });
                return () => settingsUnsub();
            }, [user]);

            if (dbError && dbError.type === 'rules') return (
                <div className="min-h-screen flex items-center justify-center bg-orange-50 p-4">
                    <div className="bg-white p-8 rounded border-2 border-orange-500 max-w-2xl text-center">
                        <h2 className="text-2xl font-bold text-orange-700 mb-2">Akses Database Ditolak</h2>
                        <p className="mb-4">Pastikan Rules Firestore Anda benar:</p>
                        <pre className="text-xs bg-gray-800 text-green-400 p-3 rounded text-left overflow-auto">
{`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /artifacts/{appId}/public/data/{collectionName}/{document=**} {
      allow read, write: if request.auth != null;
    }
    match /{document=**} {
      allow read, write: if false;
    }
  }
}`}
                        </pre>
                    </div>
                </div>
            );

            if (dbError && dbError.type === 'missing') return <div className="p-10 text-center text-red-600 font-bold">Database Belum Dibuat di Firebase Console.</div>;
            if (authError) return <div className="p-10 text-center text-red-600 font-bold">{authError}</div>;
            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="loading-spinner"></div></div>;

            return (
                <div className="min-h-screen flex flex-col">
                    <nav className="bg-blue-900 text-white shadow-lg no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setView('form')}>
                                    <i data-lucide="file-check" className="w-8 h-8"></i>
                                    <span className="font-bold text-lg hidden sm:block">Sistem Review Hilirisasi</span>
                                </div>
                                <div>
                                    <button onClick={() => setView(view === 'dashboard' ? 'dashboard' : 'login')} className="p-2 rounded-full hover:bg-blue-800 text-white opacity-70 hover:opacity-100 transition-opacity" title="Admin Area">
                                        <i data-lucide="lock" className="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow p-4 sm:p-8">
                        <div className="max-w-7xl mx-auto">
                            {view === 'form' && <ReviewForm user={user} setView={setView} announcement={announcement} />}
                            {view === 'login' && <Login setView={setView} />}
                            {view === 'dashboard' && <AdminDashboard user={user} setView={setView} currentAnnouncement={announcement} />}
                        </div>
                    </main>

                    <footer className="bg-gray-800 text-white py-6 text-center text-sm no-print">
                        <p>&copy; 2025 Universitas Maritim AMNI Semarang</p>
                    </footer>
                </div>
            );
        };

        // --- FORM REVIEW ---
        const ReviewForm = ({ user, setView, announcement }) => {
            const [formData, setFormData] = useState({
                namaReviewer: '', nidnReviewer: '',
                judulPenelitian: '', bidangPenelitian: '', perguruanTinggi: '', programStudi: '',
                ketuaNama: '', ketuaNidn: '', ketuaJabatan: '',
                lamaPenelitian: '', jumlahAnggota: '', luaran: '', tahun: '2025',
                s1_aktivitas: 0, s1_jadwal: 0, s1_tim: 0,
                jenisLuaran: 'ki', s2_ketercapaian: 0, s2_relevansi: 0, s2_periode: 0,
                s3_mitra: 0, s3_koordinasi: 0, s3_pendanaan: 0, s3_pimpinan: 0,
                s4_potensi: 0,
                komentar: ''
            });

            const [proposals, setProposals] = useState([]);
            const [submitting, setSubmitting] = useState(false);

            // Fetch Proposals untuk Dropdown
            useEffect(() => {
                if(!user) return;
                const unsub = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(PROPOSALS_COLLECTION)
                    .onSnapshot(snap => {
                        const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
                        data.sort((a,b) => a.judulPenelitian.localeCompare(b.judulPenelitian));
                        setProposals(data);
                    });
                return () => unsub();
            }, [user]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleScoreChange = (name, val) => {
                setFormData(prev => ({ ...prev, [name]: parseInt(val) }));
            };

            // Autofill saat memilih usulan
            const handleProposalSelect = (e) => {
                const selectedId = e.target.value;
                if (!selectedId) return;
                const selected = proposals.find(p => p.id === selectedId);
                if (selected) {
                    setFormData(prev => ({
                        ...prev,
                        judulPenelitian: selected.judulPenelitian,
                        bidangPenelitian: selected.bidangPenelitian,
                        perguruanTinggi: selected.perguruanTinggi,
                        programStudi: selected.programStudi,
                        ketuaNama: selected.ketuaNama,
                        ketuaNidn: selected.ketuaNidn,
                        ketuaJabatan: selected.ketuaJabatan || '',
                        lamaPenelitian: selected.lamaPenelitian,
                        jumlahAnggota: selected.jumlahAnggota,
                        luaran: selected.luaran,
                        tahun: selected.tahun
                    }));
                }
            };

            const calculate = () => {
                const t1 = (formData.s1_aktivitas * 20) + (formData.s1_jadwal * 10) + (formData.s1_tim * 10);
                const t2 = (formData.s2_ketercapaian * 10) + (formData.s2_relevansi * 10) + (formData.s2_periode * 10);
                const t3 = (formData.s3_mitra * 8) + (formData.s3_koordinasi * 5) + (formData.s3_pendanaan * 5) + (formData.s3_pimpinan * 7);
                const t4 = (formData.s4_potensi * 5);
                const totalRaw = t1 + t2 + t3 + t4;
                return { totalRaw, finalScale100: totalRaw / 4 };
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user) return alert("Sistem belum siap.");
                if (!formData.namaReviewer || !formData.judulPenelitian) return alert("Mohon lengkapi data.");
                setSubmitting(true);
                const { totalRaw, finalScale100 } = calculate();
                try {
                    const finalData = { ...formData, totalScoreRaw: totalRaw, finalScore100: finalScale100, reviewerId: user.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() };
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_NAME).add(finalData);
                    alert("Berhasil disimpan!");
                    window.location.reload(); 
                } catch (error) { alert("Gagal: " + error.message); } finally { setSubmitting(false); }
            };

            const RadioGroup = ({ name, value, onChange, options }) => (
                <div className="space-y-2 mt-2">{options.map((opt) => (<label key={opt.val} className={`flex items-start p-2 rounded border cursor-pointer hover:bg-gray-50 ${value === opt.val ? 'bg-blue-50 border-blue-500 ring-1 ring-blue-500' : 'border-gray-200'}`}><input type="radio" name={name} value={opt.val} checked={value === opt.val} onChange={(e) => onChange(name, e.target.value)} className="mt-1 h-4 w-4 text-blue-600" /><span className="ml-3 text-sm text-gray-700">{opt.label} <span className="font-bold text-blue-800 ml-1">({opt.val})</span></span></label>))}</div>
            );

            return (
                <div className="max-w-5xl mx-auto">
                    {announcement && <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 shadow-sm rounded-r-md"><div className="flex"><i data-lucide="info" className="h-5 w-5 text-yellow-400 flex-shrink-0"></i><p className="ml-3 text-sm text-yellow-700 whitespace-pre-wrap">{announcement}</p></div></div>}
                    <div className="bg-white rounded-lg shadow-md p-8 border border-gray-300">
                        
                        {/* HEADER IDENTITAS AMNI */}
                        <div className="text-center mb-8 border-b-2 border-black pb-4">
                            <div className="flex flex-col items-center justify-center mb-4">
                                <img src="https://pmb.unimar-amni.ac.id/assets/front1/img/amni-png.png" alt="Logo UNIMAR AMNI" className="h-24 mb-2 object-contain"/>
                                <h2 className="text-xl font-bold text-blue-900 uppercase tracking-wide">Lembaga Penelitian dan Pengabdian Kepada Masyarakat</h2>
                                <h1 className="text-2xl font-extrabold text-blue-900 uppercase tracking-wide">Universitas Maritim AMNI Semarang</h1>
                            </div>
                            <h2 className="text-xl font-bold uppercase mt-2">Formulir Penilaian Monitoring dan Evaluasi Internal dan Eksternal</h2>
                            <h3 className="text-lg font-bold uppercase">Ajakan Industri Tahun 2025</h3>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-8">
                            <div className="bg-blue-50 p-4 rounded border border-blue-200 mb-4">
                                <label className="block text-sm font-bold text-blue-800 mb-2">Pilih Usulan / Judul Penelitian (Autofill)</label>
                                <select onChange={handleProposalSelect} className="w-full border p-2 rounded text-gray-700">
                                    <option value="">-- Pilih Judul dari Database (Opsional) --</option>
                                    {proposals.map(p => (
                                        <option key={p.id} value={p.id}>{p.judulPenelitian} - {p.ketuaNama}</option>
                                    ))}
                                </select>
                                <p className="text-xs text-blue-600 mt-1">*Jika judul tidak ada, silakan isi manual di bawah.</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50 p-4 rounded border">
                                <h4 className="md:col-span-2 font-bold text-gray-800 border-b pb-2">Identitas Reviewer</h4>
                                <div><label className="block text-sm font-semibold">Nama Reviewer</label><input type="text" name="namaReviewer" value={formData.namaReviewer} onChange={handleChange} className="w-full border p-2 rounded" required /></div>
                                <div><label className="block text-sm font-semibold">NIDN Reviewer</label><input type="text" name="nidnReviewer" value={formData.nidnReviewer} onChange={handleChange} className="w-full border p-2 rounded" required /></div>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50 p-4 rounded border">
                                <h4 className="md:col-span-2 font-bold text-gray-800 border-b pb-2">Identitas Peneliti</h4>
                                <div className="md:col-span-2"><label className="block text-sm font-semibold">Judul Penelitian</label><textarea name="judulPenelitian" value={formData.judulPenelitian} onChange={handleChange} className="w-full border p-2 rounded" rows="2" required></textarea></div>
                                <div><label className="block text-sm font-semibold">Bidang Penelitian</label><input type="text" name="bidangPenelitian" value={formData.bidangPenelitian} onChange={handleChange} className="w-full border p-2 rounded" /></div>
                                <div><label className="block text-sm font-semibold">Perguruan Tinggi</label><input type="text" name="perguruanTinggi" value={formData.perguruanTinggi} onChange={handleChange} className="w-full border p-2 rounded" /></div>
                                <div><label className="block text-sm font-semibold">Program Studi</label><input type="text" name="programStudi" value={formData.programStudi} onChange={handleChange} className="w-full border p-2 rounded" /></div>
                                <div><label className="block text-sm font-semibold">Tahun</label><input type="text" name="tahun" value={formData.tahun} onChange={handleChange} className="w-full border p-2 rounded" /></div>
                                <div className="md:col-span-2 mt-2">
                                    <h5 className="font-semibold text-gray-700 mb-2">Ketua Peneliti</h5>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pl-4 border-l-2 border-blue-200">
                                        <div><label className="text-xs text-gray-500">Nama Lengkap</label><input type="text" name="ketuaNama" value={formData.ketuaNama} onChange={handleChange} className="w-full border p-1 rounded" required /></div>
                                        <div><label className="text-xs text-gray-500">NIDN/NIDK</label><input type="text" name="ketuaNidn" value={formData.ketuaNidn} onChange={handleChange} className="w-full border p-1 rounded" required /></div>
                                        <div><label className="text-xs text-gray-500">Jabatan Fungsional</label><input type="text" name="ketuaJabatan" value={formData.ketuaJabatan} onChange={handleChange} className="w-full border p-1 rounded" /></div>
                                    </div>
                                </div>
                                <div><label className="block text-sm font-semibold">Lama Penelitian</label><input type="text" name="lamaPenelitian" value={formData.lamaPenelitian} onChange={handleChange} className="w-full border p-2 rounded" /></div>
                                <div><label className="block text-sm font-semibold">Jumlah Anggota</label><input type="number" name="jumlahAnggota" value={formData.jumlahAnggota} onChange={handleChange} className="w-full border p-2 rounded" /></div>
                                <div className="md:col-span-2"><label className="block text-sm font-semibold">Luaran yang dijanjikan</label><input type="text" name="luaran" value={formData.luaran} onChange={handleChange} className="w-full border p-2 rounded" /></div>
                            </div>

                            {/* MATRIKS */}
                            <div className="border rounded-lg overflow-hidden">
                                <table className="w-full text-sm border-collapse">
                                    <thead className="bg-gray-100 border-b-2 border-gray-300"><tr><th className="p-2 border w-10">No</th><th className="p-2 border">Komponen</th><th className="p-2 border">Indikator</th><th className="p-2 border w-24">Skor</th><th className="p-2 border w-24">Nilai</th></tr></thead>
                                    <tbody>
                                        <tr className="bg-gray-50"><td colSpan="5" className="p-2 font-bold border">1. Pelaksanaan (40%)</td></tr>
                                        <tr><td className="p-2 border text-center">1</td><td className="p-2 border font-semibold">Kesesuaian Aktivitas (20%)</td><td className="p-2 border"><RadioGroup name="s1_aktivitas" value={formData.s1_aktivitas} onChange={handleScoreChange} options={[{val: 1, label: "Tidak Sesuai"}, {val: 3, label: "50% Sesuai"}, {val: 4, label: ">= 80% Sesuai"}]} /></td><td className="p-2 border text-center font-bold text-lg">{formData.s1_aktivitas}</td><td className="p-2 border text-center font-bold">{formData.s1_aktivitas * 20}</td></tr>
                                        <tr><td className="p-2 border text-center">2</td><td className="p-2 border font-semibold">Jadwal (10%)</td><td className="p-2 border"><RadioGroup name="s1_jadwal" value={formData.s1_jadwal} onChange={handleScoreChange} options={[{val: 1, label: "Tidak Sesuai"}, {val: 3, label: "50%"}, {val: 4, label: ">= 80%"}]} /></td><td className="p-2 border text-center font-bold">{formData.s1_jadwal}</td><td className="p-2 border text-center font-bold">{formData.s1_jadwal * 10}</td></tr>
                                        <tr><td className="p-2 border text-center">3</td><td className="p-2 border font-semibold">Tim (10%)</td><td className="p-2 border"><RadioGroup name="s1_tim" value={formData.s1_tim} onChange={handleScoreChange} options={[{val: 1, label: "Tidak aktif"}, {val: 3, label: "Sebagian"}, {val: 4, label: "Semua"}]} /></td><td className="p-2 border text-center font-bold">{formData.s1_tim}</td><td className="p-2 border text-center font-bold">{formData.s1_tim * 10}</td></tr>

                                        <tr className="bg-gray-50"><td colSpan="5" className="p-2 font-bold border">2. Luaran (30%)</td></tr>
                                        <tr><td className="p-2 border text-center">1</td><td className="p-2 border font-semibold">Ketercapaian (10%) <select name="jenisLuaran" value={formData.jenisLuaran} onChange={handleChange} className="ml-2 border p-1"><option value="ki">KI</option><option value="purwarupa">Purwarupa</option></select></td><td className="p-2 border">{formData.jenisLuaran === 'ki' ? <RadioGroup name="s2_ketercapaian" value={formData.s2_ketercapaian} onChange={handleScoreChange} options={[{val:1,label:"Belum"},{val:2,label:"Draft"},{val:3,label:"Lengkap"},{val:4,label:"Terdaftar"}]} /> : <RadioGroup name="s2_ketercapaian" value={formData.s2_ketercapaian} onChange={handleScoreChange} options={[{val:1,label:"Uji Lab"},{val:3,label:"Disempurnakan"},{val:4,label:"Uji Mitra"}]} />}</td><td className="p-2 border text-center font-bold">{formData.s2_ketercapaian}</td><td className="p-2 border text-center font-bold">{formData.s2_ketercapaian * 10}</td></tr>
                                        <tr><td className="p-2 border text-center">2</td><td className="p-2 border font-semibold">Relevansi (10%)</td><td className="p-2 border"><RadioGroup name="s2_relevansi" value={formData.s2_relevansi} onChange={handleScoreChange} options={[{val:1,label:"Tidak"},{val:2,label:"Kurang"},{val:3,label:"Sesuai"},{val:4,label:"Sangat"}]} /></td><td className="p-2 border text-center font-bold">{formData.s2_relevansi}</td><td className="p-2 border text-center font-bold">{formData.s2_relevansi * 10}</td></tr>
                                        <tr><td className="p-2 border text-center">3</td><td className="p-2 border font-semibold">Periode (10%)</td><td className="p-2 border"><RadioGroup name="s2_periode" value={formData.s2_periode} onChange={handleScoreChange} options={[{val:1,label:"Tidak"},{val:4,label:"Sesuai"}]} /></td><td className="p-2 border text-center font-bold">{formData.s2_periode}</td><td className="p-2 border text-center font-bold">{formData.s2_periode * 10}</td></tr>

                                        <tr className="bg-gray-50"><td colSpan="5" className="p-2 font-bold border">3. Kolaborasi (25%)</td></tr>
                                        <tr><td className="p-2 border text-center">1</td><td className="p-2 border font-semibold">Mitra (8%)</td><td className="p-2 border"><RadioGroup name="s3_mitra" value={formData.s3_mitra} onChange={handleScoreChange} options={[{val:1,label:"Tidak"},{val:2,label:"10-60%"},{val:3,label:"60-90%"},{val:4,label:"Seluruh"}]} /></td><td className="p-2 border text-center font-bold">{formData.s3_mitra}</td><td className="p-2 border text-center font-bold">{formData.s3_mitra * 8}</td></tr>
                                        <tr><td className="p-2 border text-center">2</td><td className="p-2 border font-semibold">Koordinasi (5%)</td><td className="p-2 border"><RadioGroup name="s3_koordinasi" value={formData.s3_koordinasi} onChange={handleScoreChange} options={[{val:1,label:"Tidak"},{val:2,label:"Awal"},{val:4,label:"Berkala"}]} /></td><td className="p-2 border text-center font-bold">{formData.s3_koordinasi}</td><td className="p-2 border text-center font-bold">{formData.s3_koordinasi * 5}</td></tr>
                                        <tr><td className="p-2 border text-center">3</td><td className="p-2 border font-semibold">Pendanaan (5%)</td><td className="p-2 border"><RadioGroup name="s3_pendanaan" value={formData.s3_pendanaan} onChange={handleScoreChange} options={[{val:1,label:"Tidak"},{val:3,label:"<=50%"},{val:4,label:"Sesuai"}]} /></td><td className="p-2 border text-center font-bold">{formData.s3_pendanaan}</td><td className="p-2 border text-center font-bold">{formData.s3_pendanaan * 5}</td></tr>
                                        <tr><td className="p-2 border text-center">4</td><td className="p-2 border font-semibold">Level Pimpinan (7%)</td><td className="p-2 border"><RadioGroup name="s3_pimpinan" value={formData.s3_pimpinan} onChange={handleScoreChange} options={[{val:2,label:"Operator"},{val:3,label:"Staf"},{val:4,label:"Direktur"}]} /></td><td className="p-2 border text-center font-bold">{formData.s3_pimpinan}</td><td className="p-2 border text-center font-bold">{formData.s3_pimpinan * 7}</td></tr>
                                    
                                        <tr className="bg-gray-50"><td colSpan="5" className="p-2 font-bold border">4. Keberlanjutan (5%)</td></tr>
                                        <tr><td className="p-2 border text-center">1</td><td className="p-2 border font-semibold">Potensi (5%)</td><td className="p-2 border"><RadioGroup name="s4_potensi" value={formData.s4_potensi} onChange={handleScoreChange} options={[{val:1,label:"Tidak"},{val:3,label:"Berpotensi"},{val:4,label:"Dirumuskan"}]} /></td><td className="p-2 border text-center font-bold">{formData.s4_potensi}</td><td className="p-2 border text-center font-bold">{formData.s4_potensi * 5}</td></tr>
                                    </tbody>
                                    <tfoot className="bg-blue-100">
                                        <tr><td colSpan="4" className="p-2 text-right font-bold">Total (Max 400)</td><td className="p-2 text-center font-bold">{calculate().totalRaw}</td></tr>
                                        <tr><td colSpan="4" className="p-2 text-right font-bold">Nilai Akhir (100)</td><td className="p-2 text-center font-bold text-xl text-blue-800">{calculate().finalScale100}</td></tr>
                                    </tfoot>
                                </table>
                            </div>
                            <div className="border p-4 rounded"><label className="font-bold">Komentar Umum</label><textarea name="komentar" rows="4" value={formData.komentar} onChange={handleChange} className="w-full border p-2 rounded"></textarea></div>
                            <div className="flex justify-end pt-4"><button type="submit" disabled={submitting} className="w-full py-4 bg-blue-600 text-white font-bold rounded shadow">{submitting ? 'Menyimpan...' : 'Kirim Penilaian'}</button></div>
                        </form>
                    </div>
                </div>
            );
        };

        const Login = ({ setView }) => {
            const [creds, setCreds] = useState({u:'', p:''});
            const handleLogin = (e) => { e.preventDefault(); if(creds.u === 'admin' && creds.p === 'admin123') setView('dashboard'); else alert("Salah"); };
            return (
                <div className="flex justify-center py-20"><form onSubmit={handleLogin} className="bg-white p-8 rounded shadow w-96 space-y-4"><h2 className="text-xl font-bold text-center">Login Admin</h2><input className="w-full border p-2 rounded" placeholder="User" value={creds.u} onChange={e=>setCreds({...creds, u:e.target.value})} /><input className="w-full border p-2 rounded" type="password" placeholder="Pass" value={creds.p} onChange={e=>setCreds({...creds, p:e.target.value})} /><div className="flex justify-between"><button type="button" onClick={()=>setView('form')} className="text-sm">Batal</button><button className="bg-blue-600 text-white py-2 px-6 rounded">Masuk</button></div></form></div>
            );
        };

        // --- ADMIN DASHBOARD ---
        const AdminDashboard = ({ user, setView, currentAnnouncement }) => {
            const [tab, setTab] = useState('reviews'); // 'reviews' or 'proposals'
            const [reviews, setReviews] = useState([]);
            const [proposals, setProposals] = useState([]);
            
            // State untuk Pengumuman
            const [announcementText, setAnnouncementText] = useState(currentAnnouncement || '');
            const [savingSettings, setSavingSettings] = useState(false);

            // State untuk Form Proposal (Add/Edit)
            const [isEditing, setIsEditing] = useState(false);
            const [editId, setEditId] = useState(null);
            const [proposalForm, setProposalForm] = useState({
                judulPenelitian: '', bidangPenelitian: '', perguruanTinggi: '', programStudi: '',
                ketuaNama: '', ketuaNidn: '', ketuaJabatan: '',
                lamaPenelitian: '', jumlahAnggota: '', luaran: '', tahun: '2025'
            });

            // Fetch Data
            useEffect(() => {
                if(!user) return;
                const unsubReviews = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_NAME).orderBy('timestamp', 'desc').onSnapshot(snap => setReviews(snap.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubProposals = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(PROPOSALS_COLLECTION).orderBy('judulPenelitian').onSnapshot(snap => setProposals(snap.docs.map(d => ({id:d.id, ...d.data()}))));
                return () => { unsubReviews(); unsubProposals(); };
            }, [user]);

            // Logic Pengumuman
            const saveAnnouncement = async () => {
                setSavingSettings(true);
                await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(SETTINGS_COLLECTION).doc('general').set({ text: announcementText }, { merge: true });
                setSavingSettings(false); alert("Pengumuman disimpan");
            };

            // Logic Proposal CRUD
            const handleProposalSubmit = async (e) => {
                e.preventDefault();
                const colRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(PROPOSALS_COLLECTION);
                if (isEditing && editId) {
                    await colRef.doc(editId).update(proposalForm);
                    alert("Data Usulan diperbarui!");
                } else {
                    await colRef.add(proposalForm);
                    alert("Usulan baru ditambahkan!");
                }
                setIsEditing(false); setEditId(null);
                setProposalForm({ judulPenelitian: '', bidangPenelitian: '', perguruanTinggi: '', programStudi: '', ketuaNama: '', ketuaNidn: '', ketuaJabatan: '', lamaPenelitian: '', jumlahAnggota: '', luaran: '', tahun: '2025' });
            };

            const handleEditProposal = (p) => {
                setIsEditing(true); setEditId(p.id); setProposalForm(p);
            };

            const handleDeleteProposal = async (id) => {
                if(confirm("Hapus data usulan ini?")) {
                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(PROPOSALS_COLLECTION).doc(id).delete();
                }
            };

            const exportToExcel = () => {
                const data = reviews.map((item, i) => ({ "No": i+1, "Judul": item.judulPenelitian, "Ketua": item.ketuaNama, "Reviewer": item.namaReviewer, "Nilai Akhir": item.finalScore100, "Komentar": item.komentar }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Rekap");
                XLSX.writeFile(wb, "Rekap_Review.xlsx");
            };

            return (
                <div className="space-y-6">
                    {/* Panel Pengumuman */}
                    <div className="bg-white p-6 rounded shadow border-l-4 border-yellow-400">
                        <h3 className="font-bold mb-2">Pengaturan Pengumuman (Tampil di Form Reviewer)</h3>
                        <div className="flex gap-2"><textarea className="flex-grow border p-2 rounded" rows="2" value={announcementText} onChange={(e) => setAnnouncementText(e.target.value)}></textarea><button onClick={saveAnnouncement} disabled={savingSettings} className="bg-yellow-500 text-white px-4 rounded">{savingSettings?'...':'Simpan'}</button></div>
                    </div>

                    {/* Navigasi Tab */}
                    <div className="flex border-b border-gray-300">
                        <button onClick={() => setTab('reviews')} className={`px-4 py-2 font-medium ${tab === 'reviews' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>Hasil Review ({reviews.length})</button>
                        <button onClick={() => setTab('proposals')} className={`px-4 py-2 font-medium ${tab === 'proposals' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>Manajemen Data Peneliti ({proposals.length})</button>
                    </div>

                    {/* TAB 1: HASIL REVIEW */}
                    {tab === 'reviews' && (
                        <div className="bg-white p-6 rounded shadow">
                            <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold">Rekapitulasi Nilai</h2><div className="flex gap-2"><button onClick={exportToExcel} className="bg-green-600 text-white px-3 py-1 rounded">Excel</button><button onClick={() => setView('form')} className="bg-red-500 text-white px-3 py-1 rounded">Keluar</button></div></div>
                            <div className="overflow-x-auto"><table className="min-w-full divide-y divide-gray-200 border text-sm"><thead className="bg-gray-50"><tr><th className="p-2 text-left">Judul</th><th className="p-2 text-left">Ketua</th><th className="p-2 text-left">Reviewer</th><th className="p-2 text-center">Nilai</th><th className="p-2">Komentar</th></tr></thead><tbody>{reviews.map(r => (<tr key={r.id} className="border-b"><td className="p-2 font-medium">{r.judulPenelitian}</td><td className="p-2">{r.ketuaNama}</td><td className="p-2">{r.namaReviewer}</td><td className="p-2 text-center font-bold text-blue-600">{r.finalScore100}</td><td className="p-2 italic text-gray-500 truncate max-w-xs">{r.komentar}</td></tr>))}</tbody></table></div>
                        </div>
                    )}

                    {/* TAB 2: MANAJEMEN PROPOSAL */}
                    {tab === 'proposals' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Form Input */}
                            <div className="bg-white p-6 rounded shadow lg:col-span-1 border-t-4 border-blue-500">
                                <h3 className="font-bold text-lg mb-4">{isEditing ? 'Edit Data Peneliti' : 'Tambah Data Peneliti Baru'}</h3>
                                <form onSubmit={handleProposalSubmit} className="space-y-3 text-sm">
                                    <div><label>Judul Penelitian</label><textarea className="w-full border p-2 rounded" rows="2" required value={proposalForm.judulPenelitian} onChange={e => setProposalForm({...proposalForm, judulPenelitian: e.target.value})}></textarea></div>
                                    <div><label>Nama Ketua</label><input className="w-full border p-2 rounded" required value={proposalForm.ketuaNama} onChange={e => setProposalForm({...proposalForm, ketuaNama: e.target.value})} /></div>
                                    <div><label>NIDN Ketua</label><input className="w-full border p-2 rounded" required value={proposalForm.ketuaNidn} onChange={e => setProposalForm({...proposalForm, ketuaNidn: e.target.value})} /></div>
                                    <div><label>Jabatan Fungsional</label><input className="w-full border p-2 rounded" value={proposalForm.ketuaJabatan} onChange={e => setProposalForm({...proposalForm, ketuaJabatan: e.target.value})} /></div>
                                    <div><label>Perguruan Tinggi</label><input className="w-full border p-2 rounded" required value={proposalForm.perguruanTinggi} onChange={e => setProposalForm({...proposalForm, perguruanTinggi: e.target.value})} /></div>
                                    <div><label>Program Studi</label><input className="w-full border p-2 rounded" value={proposalForm.programStudi} onChange={e => setProposalForm({...proposalForm, programStudi: e.target.value})} /></div>
                                    <div><label>Bidang Penelitian</label><input className="w-full border p-2 rounded" value={proposalForm.bidangPenelitian} onChange={e => setProposalForm({...proposalForm, bidangPenelitian: e.target.value})} /></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label>Lama (Thn)</label><input className="w-full border p-2 rounded" value={proposalForm.lamaPenelitian} onChange={e => setProposalForm({...proposalForm, lamaPenelitian: e.target.value})} /></div>
                                        <div><label>Jml Anggota</label><input className="w-full border p-2 rounded" value={proposalForm.jumlahAnggota} onChange={e => setProposalForm({...proposalForm, jumlahAnggota: e.target.value})} /></div>
                                    </div>
                                    <div><label>Luaran</label><input className="w-full border p-2 rounded" value={proposalForm.luaran} onChange={e => setProposalForm({...proposalForm, luaran: e.target.value})} /></div>
                                    
                                    <div className="flex gap-2 pt-2">
                                        <button className="flex-grow bg-blue-600 text-white py-2 rounded hover:bg-blue-700">{isEditing ? 'Update Data' : 'Simpan Data'}</button>
                                        {isEditing && <button type="button" onClick={() => { setIsEditing(false); setProposalForm({ judulPenelitian: '', bidangPenelitian: '', perguruanTinggi: '', programStudi: '', ketuaNama: '', ketuaNidn: '', ketuaJabatan: '', lamaPenelitian: '', jumlahAnggota: '', luaran: '', tahun: '2025' }); }} className="bg-gray-300 text-gray-700 px-3 rounded">Batal</button>}
                                    </div>
                                </form>
                            </div>

                            {/* Tabel List */}
                            <div className="bg-white p-6 rounded shadow lg:col-span-2 overflow-hidden">
                                <h3 className="font-bold text-lg mb-4">Daftar Data Peneliti Terdaftar ({proposals.length})</h3>
                                <div className="overflow-x-auto">
                                    <table className="min-w-full divide-y divide-gray-200 border text-xs">
                                        <thead className="bg-gray-50"><tr><th className="p-2 text-left">Judul</th><th className="p-2 text-left">Ketua / PT</th><th className="p-2 text-center">Aksi</th></tr></thead>
                                        <tbody className="divide-y divide-gray-200">
                                            {proposals.length === 0 ? <tr><td colSpan="3" className="p-4 text-center text-gray-500">Belum ada data. Silakan input di form sebelah kiri.</td></tr> : 
                                            proposals.map(p => (
                                                <tr key={p.id} className="hover:bg-blue-50">
                                                    <td className="p-2 font-medium text-gray-900">{p.judulPenelitian}</td>
                                                    <td className="p-2 text-gray-600">{p.ketuaNama}<br/><span className="text-xs text-gray-400">{p.perguruanTinggi}</span></td>
                                                    <td className="p-2 text-center">
                                                        <button onClick={() => handleEditProposal(p)} className="text-blue-600 hover:text-blue-900 mr-2" title="Edit"><i data-lucide="edit" className="w-4 h-4 inline"></i></button>
                                                        <button onClick={() => handleDeleteProposal(p.id)} className="text-red-600 hover:text-red-900" title="Hapus"><i data-lucide="trash-2" className="w-4 h-4 inline"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setInterval(() => window.lucide && window.lucide.createIcons(), 1000);
    </script>
</body>
</html>
